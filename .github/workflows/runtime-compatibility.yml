name: Stdlib runtime compatibility
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "35 19 * * *" # 毎日 04:35 JST
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  runtime:
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Pull requests run ubuntu + the newest Python only; push and schedule run the full matrix.
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include: ${{ github.event_name == 'pull_request' && fromJSON('[]') || fromJSON('[{"os":"windows-latest","python":"3.11"},{"os":"windows-latest","python":"3.14"},{"os":"macos-latest","python":"3.11"},{"os":"macos-latest","python":"3.14"}]') }}
        exclude: ${{ github.event_name == 'pull_request' && fromJSON('[{"os":"ubuntu-latest","python":"3.11"},{"os":"ubuntu-latest","python":"3.12"},{"os":"ubuntu-latest","python":"3.13"}]') || fromJSON('[]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: "${{ matrix.python }}"
          activate-environment: true
          enable-cache: true
          # Pull requests restore the cache and never write it; only main saves it.
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          prune-cache: true
      - name: Exercise runtime behavior without site-packages
        run: python -S -m unittest discover -s tests -p test_runtime_compatibility.py -v

  # 🔁 own sources follow main: on schedule / manual run, take main of own repositories and push to main
  follow-main:
    if: github.event_name == 'schedule'
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-follow-main.yml@main
    permissions:
      contents: write
    with:
      node-version: "26"
      check: |
        uv run --locked pytest -q -m "not network"
