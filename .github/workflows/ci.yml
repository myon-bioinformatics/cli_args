name: CLI tests
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r tests/requirements.txt
      - run: python -S -c "import cli_args; assert cli_args.__all__"
      - run: python -m pytest -q -ra --tb=short --junitxml=test-results/pytest-${{ matrix.python }}.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit-py${{ matrix.python }}
          path: test-results/pytest-${{ matrix.python }}.xml
          if-no-files-found: error
          retention-days: 14

  docker-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install -r tests/requirements.txt
      - name: Build CLI integration image
        run: docker build -f tests/docker/Dockerfile -t cli-args-test:ci .
      - name: Verify Docker transport and container-real CLI suite
        env:
          CLI_ARGS_TEST_IMAGE: cli-args-test:ci
        run: python -m pytest -q -ra --tb=short tests/test_docker_integration.py --junitxml=test-results/docker-integration.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit-docker-integration
          path: test-results/docker-integration.xml
          if-no-files-found: error
          retention-days: 14

  failure-identity:
    needs: [test, docker-integration]
    if: always()
    permissions:
      contents: read
      actions: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-junit-identity.yml@4dfda95d6573250477f991a0421fa6acb9bc0258
    with:
      expected-reports: '["junit-py3.10/pytest-3.10.xml","junit-py3.12/pytest-3.12.xml","junit-py3.14/pytest-3.14.xml","junit-docker-integration/docker-integration.xml"]'
      artifact-pattern: "junit-*"
      output-artifact: failure-identity
