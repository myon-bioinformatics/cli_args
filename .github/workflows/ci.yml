name: CI
on:
  push:
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'tests/failure_lab/README.md'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'tests/failure_lab/README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    permissions:
      contents: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-change-detection.yml@9e3da7ae1846e9604ebc24bb5178f7de094a4e77

  vendor-locked:
    if: needs.changes.outputs.product_changed == 'true'
    needs: changes
    name: Vendor locked baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: "3.15"
          activate-environment: true
          enable-cache: true
          # Pull requests restore the cache and never write it; only main saves it.
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          prune-cache: true
      - name: Resolve parent main for shared vendor tools
        id: parent-vendor-tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -S scripts/parent_vendor_tools_resolve.py --emit-github-actions
      - name: Fetch shared vendor tool at resolved parent main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: myon-bioinformatics/myon-bioinformatics
          ref: ${{ steps.parent-vendor-tools.outputs.sha }}
          path: .vendor-sync-tools
          persist-credentials: false
      - name: Sync locked development environment
        shell: bash
        run: |
          uv sync --locked --python "$(python -c 'import sys; print(sys.executable)')"
          python -c "import os; from pathlib import Path; print(Path('.venv').resolve() / ('Scripts' if os.name == 'nt' else 'bin'))" >> "$GITHUB_PATH"
      - name: Network parent vendor tools resolve regressions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --locked pytest -q -m network tests/test_parent_vendor_tools_resolve.py
      - name: Verify and recreate locked vendor snapshot
        shell: bash
        run: |
          set -euo pipefail
          python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
          python -S .vendor-sync-tools/vendor_sync.py recreate --manifest vendor.lock.json

  test:
    if: needs.changes.outputs.product_changed == 'true'
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'latest'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: "${{ matrix.python }}"
          activate-environment: true
          enable-cache: true
          # Pull requests restore the cache and never write it; only main saves it.
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          prune-cache: true
      - name: Sync locked development environment
        shell: bash
        run: |
          uv sync --locked --python "$(python -c 'import sys; print(sys.executable)')"
          python -c "import os; from pathlib import Path; print(Path('.venv').resolve() / ('Scripts' if os.name == 'nt' else 'bin'))" >> "$GITHUB_PATH"
      - run: python -S -c "import cli_args; assert cli_args.__all__"
      - run: uv run --locked pytest -q -m "not network" -ra --tb=short --junitxml=test-results/pytest-${{ matrix.python }}.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-py${{ matrix.python }}
          path: test-results/pytest-${{ matrix.python }}.xml
          if-no-files-found: error
          retention-days: 14

  node-runtime:
    if: needs.changes.outputs.product_changed == 'true'
    needs: changes
    name: node bridge (${{ matrix.os }} / node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['26', 'latest']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: "3.15"
          activate-environment: true
          enable-cache: true
          # Pull requests restore the cache and never write it; only main saves it.
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          prune-cache: true
      - name: Sync locked development environment
        shell: bash
        run: |
          uv sync --locked --python "$(python -c 'import sys; print(sys.executable)')"
          python -c "import os; from pathlib import Path; print(Path('.venv').resolve() / ('Scripts' if os.name == 'nt' else 'bin'))" >> "$GITHUB_PATH"
      - run: uv run --locked pytest -q -m "not network" -ra --tb=short tests/test_node_bridge.py --junitxml=test-results/node-${{ matrix.os }}-${{ matrix.node }}.xml
      - run: node --test tests/node/cli_args.test.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-node-${{ matrix.os }}-${{ matrix.node }}
          path: test-results/node-${{ matrix.os }}-${{ matrix.node }}.xml
          if-no-files-found: error
          retention-days: 14

  docker-integration:
    if: needs.changes.outputs.product_changed == 'true'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: "3.15"
          activate-environment: true
          enable-cache: true
          # Pull requests restore the cache and never write it; only main saves it.
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          prune-cache: true
      - name: Sync locked development environment
        shell: bash
        run: |
          uv sync --locked --python "$(python -c 'import sys; print(sys.executable)')"
          python -c "import os; from pathlib import Path; print(Path('.venv').resolve() / ('Scripts' if os.name == 'nt' else 'bin'))" >> "$GITHUB_PATH"
      # A cold build took 50 s: 23 s installing 227 apt packages (systemd, ffmpeg) and
      # 20 s gzip-compressing that layer. Reuse the layers from the GitHub Actions cache
      # (default docker driver + containerd image store); only main writes the cache.
      - name: Build CLI integration image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: tests/docker/Dockerfile
          tags: cli-args-test:ci
          load: true
          cache-from: type=gha,scope=cli-args-test
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'type=gha,scope=cli-args-test,mode=max' || '' }}
      - name: Verify Docker transport and Compose grammar
        env:
          CLI_ARGS_TEST_IMAGE: cli-args-test:ci
        run: uv run --locked pytest -q -m "not network" -ra --tb=short tests/test_docker_integration.py tests/test_docker_policy.py --junitxml=test-results/docker-integration.xml
      - name: Run container-real CLI suite
        run: >-
          docker run --rm
          -v "$PWD/test-results:/reports"
          cli-args-test:ci
          uv run --locked pytest -q -m "not network" -ra --tb=short tests/test_container_commands.py tests/test_container_patterns.py
          --junitxml=/reports/container-real.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-docker-integration
          path: test-results/docker-integration.xml
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-container-real
          path: test-results/container-real.xml
          if-no-files-found: error
          retention-days: 14

  portability:
    if: needs.changes.outputs.product_changed == 'true'
    needs: changes
    name: core portability (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
          - os: macos
            runner: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'latest'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: "3.15"
          activate-environment: true
          enable-cache: true
          # Pull requests restore the cache and never write it; only main saves it.
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          prune-cache: true
      - name: Sync locked development environment
        shell: bash
        run: |
          uv sync --locked --python "$(python -c 'import sys; print(sys.executable)')"
          python -c "import os; from pathlib import Path; print(Path('.venv').resolve() / ('Scripts' if os.name == 'nt' else 'bin'))" >> "$GITHUB_PATH"
      - run: python -S -c "import cli_args; assert cli_args.__all__"
      - run: uv run --locked pytest -q -m "not network" -ra --tb=short tests/test_cli_args.py tests/test_cli_args_main.py tests/test_stdlib_commands.py tests/test_stdlib_functions.py tests/test_orchestration.py tests/test_observation_surface.py tests/test_option_suggestions.py tests/test_node_bridge.py --junitxml=test-results/core-${{ matrix.os }}.xml
      - run: node --test tests/node/cli_args.test.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-core-${{ matrix.os }}
          path: test-results/core-${{ matrix.os }}.xml
          if-no-files-found: error
          retention-days: 14


  negative-evidence:
    if: needs.changes.outputs.product_changed == 'true'
    needs: changes
    name: negative evidence / intentional failures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: "3.15"
          activate-environment: true
          enable-cache: true
          # Pull requests restore the cache and never write it; only main saves it.
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          prune-cache: true
      - name: Sync locked development environment
        shell: bash
        run: |
          uv sync --locked --python "$(python -c 'import sys; print(sys.executable)')"
          python -c "import os; from pathlib import Path; print(Path('.venv').resolve() / ('Scripts' if os.name == 'nt' else 'bin'))" >> "$GITHUB_PATH"
      - name: Run intentional failure lab and validate raw JUnit
        run: python tests/failure_lab/run_lab.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: negative-evidence-raw
          path: |
            test-results/negative-evidence/intentional-failure.xml
            test-results/negative-evidence/receipt.json
            test-results/negative-evidence/child-stdout.txt
            test-results/negative-evidence/child-stderr.txt
            test-results/negative-evidence/diagnostics.log
          if-no-files-found: error
          retention-days: 14

  negative-failure-identity:
    needs: [changes, negative-evidence]
    if: (always()) && needs.changes.outputs.product_changed == 'true'
    permissions:
      contents: read
      actions: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-junit-identity.yml@9e3da7ae1846e9604ebc24bb5178f7de094a4e77
    with:
      commit-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      expected-reports: '["negative-evidence-raw/intentional-failure.xml"]'
      artifact-pattern: "negative-evidence-raw"
      output-artifact: negative-failure-identity

  failure-identity:
    needs: [changes, test, node-runtime, docker-integration, portability]
    if: (always()) && needs.changes.outputs.product_changed == 'true'
    permissions:
      contents: read
      actions: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-junit-identity.yml@9e3da7ae1846e9604ebc24bb5178f7de094a4e77
    with:
      commit-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      expected-reports: '["junit-py3.11/pytest-3.11.xml","junit-py3.12/pytest-3.12.xml","junit-py3.14/pytest-3.14.xml","junit-node-ubuntu-latest-26/node-ubuntu-latest-26.xml","junit-node-ubuntu-latest-latest/node-ubuntu-latest-latest.xml","junit-node-windows-latest-26/node-windows-latest-26.xml","junit-node-windows-latest-latest/node-windows-latest-latest.xml","junit-node-macos-latest-26/node-macos-latest-26.xml","junit-node-macos-latest-latest/node-macos-latest-latest.xml","junit-docker-integration/docker-integration.xml","junit-container-real/container-real.xml","junit-core-windows/core-windows.xml","junit-core-macos/core-macos.xml"]'
      artifact-pattern: "junit-*"
      output-artifact: failure-identity

  actionlint:
    needs: changes
    if: needs.changes.outputs.workflow_changed == 'true'
    permissions:
      contents: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-actionlint.yml@9e3da7ae1846e9604ebc24bb5178f7de094a4e77
