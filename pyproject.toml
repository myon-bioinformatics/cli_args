[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-args-dev"
# Keep in sync with cli_args.__version__ (enforced in tests/test_cli_args_main.py).
version = "0.0.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

# The installed artifact is one stdlib-only module; dev tools stay in dependency groups.
[tool.uv]

[tool.uv.dependency-groups]
dev = { requires-python = ">=3.11" }

[project.scripts]
cli_args = "cli_args:_main"

[tool.setuptools]
py-modules = ["cli_args"]
